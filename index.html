<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад занять</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; }
    button.primary { background: #2563eb; color: white; border: none; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
    .modal.hidden { display: none; }
    .modal-content { background: #fff; padding: 24px; border-radius: 8px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    .flex-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Розклад занять</h1>
    <div class="controls">
      <button id="today-btn">Сьогодні</button>
      <button id="prev-date-btn">&lt;</button>
      <span id="current-date-display" style="font-weight: bold;"></span>
      <button id="next-date-btn">&gt;</button>
      <div style="margin-left: 16px;">
        <button id="view-day-btn">День</button>
        <button id="view-week-btn">Тиждень</button>
        <button id="view-month-btn">Місяць</button>
      </div>
      <button id="edit-schedule-btn" class="primary">Редагувати</button>
    </div>
  </div>

  <div id="calendar-grid"></div>

  <!-- Модальне вікно для додавання учнів та занять -->
  <div id="modal-overlay" class="modal hidden">
    <div class="modal-content">
      <h2>Редагування розкладу</h2>

      <h3>1. Додати учня</h3>
      <div class="form-group flex-row">
        <input type="text" id="new-student-name" placeholder="Ім'я учня">
        <input type="color" id="new-student-color" value="#3b82f6" style="width: 50px;">
        <button id="add-student-btn" type="button">Додати</button>
      </div>
      <ul id="students-list" style="padding-left: 0; list-style: none;"></ul>

      <hr style="margin: 20px 0;">

      <h3>2. Додати заняття</h3>
      <div class="form-group">
        <label>Учень</label>
        <select id="lesson-student-select"></select>
      </div>
      <div class="form-group">
        <label>День тижня</label>
        <select id="lesson-day-select">
          <option value="0">Понеділок</option>
          <option value="1">Вівторок</option>
          <option value="2">Середа</option>
          <option value="3">Четвер</option>
          <option value="4">П'ятниця</option>
          <option value="5">Субота</option>
          <option value="6">Неділя</option>
        </select>
      </div>
      <div class="form-group flex-row">
        <div style="flex: 1;">
          <label>Час початку</label>
          <input type="time" id="lesson-time-input" value="14:00">
        </div>
        <div style="flex: 1;">
          <label>Тривалість (хв)</label>
          <input type="number" id="lesson-duration-input" value="60">
        </div>
      </div>
      <button id="save-lesson-btn" type="button" style="width: 100%; margin-top: 8px;">Додати заняття</button>

      <hr style="margin: 20px 0;">

      <div class="flex-row" style="justify-content: flex-end;">
        <button id="close-modal-btn" type="button">Скасувати</button>
        <button id="save-modal-btn" type="button" class="primary">Зберегти та закрити</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
