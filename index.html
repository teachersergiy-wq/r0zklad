<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад занять</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { cursor: pointer; padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font-weight: 500; }
    button:hover { background: #f1f5f9; }
    button.primary { background: #2563eb; color: white; border: none; }
    button.primary:hover { background: #1d4ed8; }
    button.danger { background: #ef4444; color: white; border: none; padding: 4px 8px; font-size: 0.8rem; }
    
    .calendar-grid { display: grid; gap: 8px; margin-top: 10px; }
    .grid-week { grid-template-columns: 60px repeat(7, 1fr); }
    .grid-day { grid-template-columns: 60px 1fr; }
    
    .time-slot { border-top: 1px dashed #e2e8f0; height: 48px; display: flex; align-items: center; justify-content: center; position: relative; }
    .time-label { font-size: 0.75rem; color: #64748b; text-align: right; padding-right: 8px; border: none; }
    .day-header { font-weight: bold; text-align: center; padding: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; }
    
    .slot-free { border: 1px dashed #cbd5e1; border-radius: 4px; color: #94a3b8; font-size: 0.75rem; height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; background: #fafafa; }
    .slot-free.drag-over { background: #e0e7ff; border-color: #6366f1; }
    
    .lesson-card { width: 100%; height: 100%; border-radius: 4px; padding: 4px 6px; color: white; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .lesson-card:active { cursor: grabbing; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal.hidden { display: none; }
    .modal-content { background: #fff; padding: 20px; border-radius: 8px; max-width: 450px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .flex-row { display: flex; gap: 8px; align-items: center; }
    
    .student-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="margin:0; font-size: 1.5rem;">Розклад занять</h1>
    <div class="controls">
      <button id="today-btn">Сьогодні</button>
      <button id="prev-date-btn">&lt;</button>
      <span id="current-date-display" style="font-weight: bold; min-width: 140px; text-align: center;"></span>
      <button id="next-date-btn">&gt;</button>
      
      <div style="margin-left: 10px; display: flex; gap: 4px;">
        <button id="view-day-btn">День</button>
        <button id="view-week-btn">Тиждень</button>
        <button id="view-month-btn">Місяць</button>
      </div>

      <button id="manage-students-btn">Учні</button>
      <button id="add-lesson-btn" class="primary">+ Урок</button>
    </div>
  </div>

  <div id="calendar-grid"></div>

  <!-- Модальне вікно учнів -->
  <div id="students-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Управління учнями</h2>
      <div class="form-group flex-row">
        <input type="text" id="new-student-name" placeholder="Ім'я учня" style="flex:1;">
        <input type="color" id="new-student-color" value="#3b82f6" style="width: 40px; height: 36px; padding:0;">
        <button id="add-student-btn" type="button" class="primary">Додати</button>
      </div>
      <div id="students-list" style="margin-top: 15px;"></div>
      <div style="text-align: right; margin-top: 15px;">
        <button id="close-students-modal-btn">Закрити</button>
      </div>
    </div>
  </div>

  <!-- Модальне вікно додавання уроку -->
  <div id="lesson-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Додати урок</h2>
      
      <div class="form-group">
        <label>Оберіть учня</label>
        <select id="lesson-student-select"></select>
      </div>

      <div class="form-group">
        <label>Дата уроку</label>
        <input type="date" id="lesson-date-input">
      </div>

      <div class="form-group flex-row">
        <div style="flex:1;">
          <label>Година</label>
          <select id="lesson-hour-select"></select>
        </div>
        <div style="flex:1;">
          <label>Хвилини</label>
          <select id="lesson-minute-select"></select>
        </div>
      </div>

      <div class="form-group">
        <label>Повторення (щотижня)</label>
        <select id="lesson-repeat-select">
          <option value="1">Лише один раз</option>
          <option value="2">2 тижні поспіль</option>
          <option value="3">3 тижні поспіль</option>
          <option value="4">4 тижні поспіль</option>
          <option value="8">8 тижнів поспіль</option>
        </select>
      </div>

      <div class="flex-row" style="justify-content: flex-end; margin-top: 20px;">
        <button id="close-lesson-modal-btn" type="button">Скасувати</button>
        <button id="save-lesson-btn" type="button" class="primary">Зберегти урок</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
