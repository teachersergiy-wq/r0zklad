<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад занять</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ВЕРХНЯ ПАНЕЛЬ: ЗАГОЛОВОК ТА КНОПКИ УПРАВЛІННЯ -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">Розклад занять</h1>
    </div>
    
    <div class="header-controls">
      <div class="btn-group">
        <button id="today-btn" class="btn btn-secondary">Сьогодні</button>
      </div>

      <div class="btn-group view-switcher">
        <button id="view-day-btn" class="btn btn-tab">День</button>
        <button id="view-week-btn" class="btn btn-tab active">Тиждень</button>
        <button id="view-month-btn" class="btn btn-tab">Місяць</button>
      </div>

      <button id="edit-schedule-btn" class="btn btn-primary">Редагувати</button>
    </div>
  </header>

  <!-- ПАНЕЛЬ НАВІГАЦІЇ ПО ДАТАХ -->
  <div class="date-navigation">
    <button id="prev-date-btn" class="nav-btn" aria-label="Попередній період">&lt;</button>
    <span id="current-date-display" class="date-display"></span>
    <button id="next-date-btn" class="nav-btn" aria-label="Наступний період">&gt;</button>
  </div>

  <!-- ОСНОВНА СІТКА КАЛЕНДАРЯ -->
  <main class="calendar-container">
    <div id="calendar-grid" class="calendar-grid week-view"></div>
  </main>

  <!-- МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ УЧНІВ ТА ЗАНЯТЬ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Редагування розкладу</h2>
        <button id="close-modal-btn" class="btn-close">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- Секція додавання учнів -->
        <section class="editor-section">
          <h3>Учні та кольори</h3>
          <div class="add-student-form">
            <input type="text" id="new-student-name" placeholder="Ім'я учня" class="input-field">
            <input type="color" id="new-student-color" value="#3b82f6" class="color-picker">
            <button id="add-student-btn" class="btn btn-secondary">Додати</button>
          </div>
          <ul id="students-list" class="students-list"></ul>
        </section>

        <!-- Секція занять -->
        <section class="editor-section">
          <h3>Додати / Змінити заняття</h3>
          <div class="lesson-form">
            <div class="form-group">
              <label for="lesson-student-select">Учень:</label>
              <select id="lesson-student-select" class="input-field"></select>
            </div>
            
            <div class="form-group">
              <label for="lesson-day-select">День тижня:</label>
              <select id="lesson-day-select" class="input-field">
                <option value="1">Понеділок</option>
                <option value="2">Вівторок</option>
                <option value="3">Середа</option>
                <option value="4">Четвер</option>
                <option value="5">П'ятниця</option>
                <option value="6">Субота</option>
                <option value="0">Неділя</option>
              </select>
            </div>

            <div class="form-group">
              <label for="lesson-time-input">Час початку:</label>
              <input type="time" id="lesson-time-input" class="input-field" value="10:00">
            </div>

            <div class="form-group">
              <label for="lesson-duration-input">Тривалість (хв):</label>
              <input type="number" id="lesson-duration-input" class="input-field" value="60" step="15" min="15">
            </div>

            <button id="save-lesson-btn" class="btn btn-primary">Зберегти заняття</button>
          </div>
        </section>
      </div>

      <div class="modal-footer">
        <button id="save-modal-btn" class="btn btn-primary">Заберегти та закрити</button>
      </div>
    </div>
  </div>

  <!-- ПОДОРОЖІ ТА СКРИПТИ (ПРАВИЛЬНИЙ ПОРЯДОК ПІДКТЮЧЕННЯ) -->
  <!-- 1. Спочатку обов'язково завантажується бібліотека Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. Лише один раз підключається ваш код додатка -->
  <script src="app.js"></script>

</body>
</html>
