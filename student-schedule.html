<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вільні години для запису</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f8fafc; margin: 0; padding: 16px; color: #1e293b; }

    .header { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; text-align: center; }
    .header h1 { margin: 0; font-size: 1.3rem; color: #0f172a; }
    .header p { margin: 0; font-size: 0.85rem; color: #64748b; max-width: 480px; }

    .nav-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
    button { cursor: pointer; padding: 8px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-weight: 600; font-size: 0.88rem; color: #1e293b; }
    button:hover { background: #f1f5f9; }
    button.primary { background: #2563eb; color: #fff; border: none; }

    .date-display-big { font-size: 1.6rem; font-weight: 800; color: #0f172a; }

    .week-columns { display: flex; gap: 8px; margin-top: 6px; align-items: flex-start; }
    .week-columns.mobile-stack { flex-direction: column; }
    .day-column { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px; }

    .day-header { text-align: center; padding: 8px 4px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .day-header.today { background: #dbeafe !important; border: 2px solid #2563eb !important; color: #1e40af !important; }
    .day-header-name { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: #64748b; }
    .day-header.today .day-header-name { color: #1d4ed8; }
    .day-header-date { font-size: 1.05rem; font-weight: 800; color: #0f172a; margin-top: 1px; }

    .slot-free { border: 1px dashed #86efac; border-radius: 6px; color: #15803d; font-size: 0.8rem; min-height: 44px; width: 100%; display: flex; align-items: center; justify-content: center; background: #f0fdf4; font-weight: 700; text-align: center; padding: 6px; }
    .no-slots { color: #94a3b8; font-size: 0.78rem; text-align: center; padding: 8px; }

    .loading { text-align: center; color: #64748b; padding: 40px; font-size: 0.95rem; }

    @media (max-width: 640px) {
      body { padding: 10px; }
      .date-display-big { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📅 Вільні години для запису</h1>
    <p>Тут показано лише вільні для запису години. Щоб записатись на урок, зверніться до викладача.</p>
  </div>

  <div class="nav-row">
    <button id="prev-week-btn">&lt;</button>
    <span id="current-week-display" class="date-display-big"></span>
    <button id="next-week-btn">&gt;</button>
  </div>
  <div class="nav-row">
    <button id="today-btn" class="primary">Поточний тиждень</button>
  </div>

  <div id="schedule-container">
    <div class="loading">Завантаження розкладу...</div>
  </div>

  <script src="student-schedule.js"></script>
</body>
</html>
